name: Arquitectura y modelo de datos
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquitectura-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: sebastian_clavijo_correa
    env:
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sebastian_clavijo_correa/requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps --no-build-isolation
          cmp .github/workflows/bigdata.yml ../.github/workflows/bigdata.yml
      - name: Probar reglas y restricciones
        run: |
          mkdir -p build
          python -m unittest discover -s tests -v 2>&1 | tee build/tests.log
      - name: Reproducir ingesta, limpiar, enriquecer y construir SQLite
        run: python src/pipeline.py --output-dir build
      - name: Verificar documento y registrar resumen
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          pdf = Path('docs/arquitectura_modelo.pdf')
          assert pdf.read_bytes().startswith(b'%PDF-'), 'Falta el PDF final'
          result = json.loads(Path('build/static/auditoria/pipeline_validation.json').read_text())
          assert result['status'] == 'PASS'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('# Arquitectura validada\n\n43.800 filas, 63 columnas; replay de EA1 y CSV de EA2/EA3 conservados.\n\nSQLite: reconstrucción exacta y claves foráneas verificadas.\n')
          PY
      - name: Conservar evidencias nuevas y documento
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arquitectura-modelo-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sebastian_clavijo_correa/build/
            sebastian_clavijo_correa/docs/arquitectura_modelo.pdf
            sebastian_clavijo_correa/docs/diagramas/
          if-no-files-found: error
          retention-days: 30
